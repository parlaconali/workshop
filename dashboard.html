<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد — ورکشاپ ایتالیایی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --ink:      #222222;
  --ink2:     #555555;
  --ink3:     #999999;
  --white:    #ffffff;
  --off:      #f5f5f3;
  --border:   #e0e0de;
  --green:    #7ec800;
  --green-lt: #f0fad8;
  --green-dk: #5fa000;
  --red:      #d03030;
  --red-lt:   #fff5f5;
  --yellow:   #f5a623;
  --yellow-lt:#fff8ee;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Vazirmatn', sans-serif;
  background: var(--off);
  color: var(--ink);
  direction: rtl;
  min-height: 100vh;
}

/* LOGIN */
.login-wrap {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-card {
  background: var(--white);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 380px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  border: 1.5px solid var(--ink);
}

.login-logo {
  font-size: 20px;
  font-weight: 900;
  color: var(--ink);
  text-align: center;
}

.login-logo span {
  background: var(--green);
  color: var(--white);
  padding: 2px 9px;
  border-radius: 5px;
  margin-right: 4px;
}

.login-title {
  font-size: 14px;
  color: var(--ink3);
  text-align: center;
  font-weight: 600;
}

.login-input {
  padding: 13px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 14px;
  color: var(--ink);
  background: var(--off);
  outline: none;
  width: 100%;
  direction: ltr;
  text-align: center;
  letter-spacing: 0.1em;
  transition: border-color 0.15s;
}

.login-input:focus { border-color: var(--ink); background: var(--white); }
.login-input.error { border-color: var(--red); }

.login-btn {
  background: var(--ink);
  color: var(--white);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 14px;
  font-weight: 800;
  padding: 14px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  width: 100%;
  transition: background 0.15s;
}

.login-btn:hover { background: var(--green); }

.login-error {
  font-size: 12px;
  color: var(--red);
  text-align: center;
  display: none;
}

/* DASHBOARD */
.dashboard { display: none; }

.top-bar {
  background: var(--ink);
  padding: 16px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.top-logo {
  font-size: 16px;
  font-weight: 900;
  color: var(--white);
}

.top-logo span {
  background: var(--green);
  color: var(--white);
  padding: 2px 8px;
  border-radius: 4px;
  margin-right: 4px;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.refresh-btn {
  background: rgba(255,255,255,0.1);
  color: var(--white);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.2);
  cursor: pointer;
  transition: background 0.15s;
}

.refresh-btn:hover { background: rgba(255,255,255,0.2); }

.logout-btn {
  background: transparent;
  color: rgba(255,255,255,0.5);
  font-family: 'Vazirmatn', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.1);
  cursor: pointer;
  transition: all 0.15s;
}

.logout-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.3); }

.dash-body { padding: 32px; max-width: 1200px; margin: 0 auto; }

/* STATS */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--white);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border: 1.5px solid var(--border);
}

.stat-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--ink3);
  letter-spacing: 0.08em;
}

.stat-val {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: -0.03em;
  color: var(--ink);
  line-height: 1;
}

.stat-val.green { color: var(--green-dk); }

.stat-sub {
  font-size: 11px;
  color: var(--ink3);
}

/* FILTERS */
.filters {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}

.filter-btn {
  font-family: 'Vazirmatn', sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--white);
  color: var(--ink2);
  cursor: pointer;
  transition: all 0.15s;
}

.filter-btn:hover { border-color: var(--ink); color: var(--ink); }
.filter-btn.active { background: var(--ink); color: var(--white); border-color: var(--ink); }

.search-input {
  padding: 8px 14px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-family: 'Vazirmatn', sans-serif;
  font-size: 12px;
  color: var(--ink);
  background: var(--white);
  outline: none;
  width: 200px;
  transition: border-color 0.15s;
  margin-right: auto;
}

.search-input:focus { border-color: var(--ink); }

/* TABLE */
.table-wrap {
  background: var(--white);
  border-radius: 14px;
  border: 1.5px solid var(--border);
  overflow: hidden;
}

.table-header {
  padding: 16px 20px;
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.table-title {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
}

.table-count {
  font-size: 12px;
  color: var(--ink3);
  font-weight: 600;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th {
  padding: 12px 16px;
  text-align: right;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: var(--ink3);
  background: var(--off);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

td {
  padding: 14px 16px;
  font-size: 13px;
  color: var(--ink);
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--off); }

.td-name { font-weight: 700; }
.td-email { direction: ltr; text-align: right; color: var(--ink2); font-size: 12px; }
.td-option { font-size: 11px; color: var(--ink2); }
.td-amount { font-weight: 800; direction: ltr; text-align: right; }
.td-date { color: var(--ink3); font-size: 11px; direction: ltr; text-align: right; }

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.status-paid { background: var(--green-lt); color: var(--green-dk); }
.status-pending { background: var(--yellow-lt); color: var(--yellow); }
.status-refunded { background: var(--red-lt); color: var(--red); }

.loading {
  text-align: center;
  padding: 48px;
  color: var(--ink3);
  font-size: 14px;
}

.empty {
  text-align: center;
  padding: 48px;
  color: var(--ink3);
  font-size: 14px;
}

@media (max-width: 860px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .dash-body { padding: 20px 16px; }
  .top-bar { padding: 14px 16px; }
  th:nth-child(n+5), td:nth-child(n+5) { display: none; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-logo"><span>ورکشاپ</span> ایتالیایی</div>
    <div class="login-title">داشبورد مدرس — ورود</div>
    <input class="login-input" type="password" id="passwordInput" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')login()">
    <button class="login-btn" onclick="login()">ورود به داشبورد</button>
    <div class="login-error" id="loginError">رمز عبور اشتباه است</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div class="top-logo"><span>ورکشاپ</span> ایتالیایی — داشبورد</div>
    <div class="top-right">
      <button class="refresh-btn" onclick="loadBookings()">↻ بروزرسانی</button>
      <button class="logout-btn" onclick="logout()">خروج</button>
    </div>
  </div>

  <div class="dash-body">
    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">کل ثبت‌نام‌ها</div>
        <div class="stat-val" id="statTotal">—</div>
        <div class="stat-sub">همه جلسات</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">پرداخت شده</div>
        <div class="stat-val green" id="statPaid">—</div>
        <div class="stat-sub">تأیید شده</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">درآمد کل</div>
        <div class="stat-val green" id="statRevenue">—</div>
        <div class="stat-sub">یورو</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">بسته کامل</div>
        <div class="stat-val" id="statBundle">—</div>
        <div class="stat-sub">نفر</div>
      </div>
    </div>

    <!-- FILTERS -->
    <div class="filters">
      <input class="search-input" type="text" id="searchInput" placeholder="جستجو..." oninput="renderTable()">
      <button class="filter-btn active" onclick="setFilter('all', this)">همه</button>
      <button class="filter-btn" onclick="setFilter('paid', this)">پرداخت شده</button>
      <button class="filter-btn" onclick="setFilter('pending', this)">در انتظار</button>
      <button class="filter-btn" onclick="setFilter('bundle', this)">بسته کامل</button>
      <button class="filter-btn" onclick="setFilter('s1', this)">جلسه ۱</button>
      <button class="filter-btn" onclick="setFilter('s2', this)">جلسه ۲</button>
      <button class="filter-btn" onclick="setFilter('s3', this)">جلسه ۳</button>
      <button class="filter-btn" onclick="setFilter('s4', this)">جلسه ۴</button>
      <button class="filter-btn" onclick="setFilter('s5', this)">جلسه ۵</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <div class="table-header">
        <div class="table-title">لیست ثبت‌نام‌ها</div>
        <div class="table-count" id="tableCount">—</div>
      </div>
      <div id="tableBody">
        <div class="loading">در حال بارگذاری...</div>
      </div>
    </div>
  </div>
</div>

<script>
  const SERVER = 'https://bot.parlaconali.com';
  const PASSWORD = 'parlaconali2025';
  let allBookings = [];
  let currentFilter = 'all';

  function login() {
    const pwd = document.getElementById('passwordInput').value;
    if (pwd === PASSWORD) {
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadBookings();
    } else {
      document.getElementById('loginError').style.display = 'block';
      document.getElementById('passwordInput').classList.add('error');
    }
  }

  function logout() {
    document.getElementById('loginWrap').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  }

  async function loadBookings() {
    document.getElementById('tableBody').innerHTML = '<div class="loading">در حال بارگذاری...</div>';
    try {
      const res = await fetch(`${SERVER}/bookings?password=${PASSWORD}`);
      const data = await res.json();
      allBookings = data.bookings || [];
      updateStats();
      renderTable();
    } catch(e) {
      document.getElementById('tableBody').innerHTML = '<div class="empty">خطا در بارگذاری داده‌ها</div>';
    }
  }

  function updateStats() {
    const paid = allBookings.filter(b => b.status === 'پرداخت شده');
    const revenue = paid.reduce((sum, b) => sum + (b.amount || 0), 0);
    const bundles = allBookings.filter(b => b.option && b.option.includes('بسته'));

    document.getElementById('statTotal').textContent = allBookings.length;
    document.getElementById('statPaid').textContent = paid.length;
    document.getElementById('statRevenue').textContent = '€' + revenue;
    document.getElementById('statBundle').textContent = bundles.length;
  }

  function setFilter(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();

    let filtered = allBookings.filter(b => {
      const matchSearch = !search ||
        (b.name && b.name.toLowerCase().includes(search)) ||
        (b.email && b.email.toLowerCase().includes(search)) ||
        (b.option && b.option.toLowerCase().includes(search));

      const matchFilter =
        currentFilter === 'all' ? true :
        currentFilter === 'paid' ? b.status === 'پرداخت شده' :
        currentFilter === 'pending' ? b.status === 'در انتظار پرداخت' :
        currentFilter === 'bundle' ? (b.option && b.option.includes('بسته')) :
        currentFilter === 's1' ? (b.option && b.option.includes('۱')) :
        currentFilter === 's2' ? (b.option && b.option.includes('۲')) :
        currentFilter === 's3' ? (b.option && b.option.includes('۳')) :
        currentFilter === 's4' ? (b.option && b.option.includes('۴')) :
        currentFilter === 's5' ? (b.option && b.option.includes('۵')) :
        true;

      return matchSearch && matchFilter;
    });

    document.getElementById('tableCount').textContent = filtered.length + ' نفر';

    if (filtered.length === 0) {
      document.getElementById('tableBody').innerHTML = '<div class="empty">هیچ ثبت‌نامی یافت نشد</div>';
      return;
    }

    const statusClass = s =>
      s === 'پرداخت شده' ? 'status-paid' :
      s === 'در انتظار پرداخت' ? 'status-pending' : 'status-refunded';

    const formatDate = d => d ? new Date(d).toLocaleDateString('it-IT') : '—';

    const rows = filtered.map(b => `
      <tr>
        <td class="td-name">${b.name || '—'}</td>
        <td class="td-email">${b.email || '—'}</td>
        <td class="td-option">${b.option || '—'}</td>
        <td class="td-amount">€${b.amount || 0}</td>
        <td><span class="status-badge ${statusClass(b.status)}">${b.status || '—'}</span></td>
        <td class="td-date">${formatDate(b.date)}</td>
      </tr>
    `).join('');

    document.getElementById('tableBody').innerHTML = `
      <table>
        <thead>
          <tr>
            <th>نام</th>
            <th>ایمیل</th>
            <th>گزینه</th>
            <th>مبلغ</th>
            <th>وضعیت</th>
            <th>تاریخ</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }
</script>

</body>
</html>
